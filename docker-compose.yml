services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: networkforge
      POSTGRES_PASSWORD: networkforge_local
      POSTGRES_DB: networkforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networkforge -d networkforge"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgres://networkforge:networkforge_local@postgres:5432/networkforge?sslmode=disable
    ports:
      - "${NETWORKFORGE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build: ./apps/web
    environment:
      NETWORKFORGE_API_URL: http://api:8080
    ports:
      - "${NETWORKFORGE_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
